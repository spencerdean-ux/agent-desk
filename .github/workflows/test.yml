name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The tests make git repositories of their own, so git needs a name to commit under.
      - run: git config --global user.name "test" && git config --global user.email "test@example.com" && git config --global init.defaultBranch main
      - run: node --test --test-timeout=120000
